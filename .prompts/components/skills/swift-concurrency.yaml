load_instructions: |
  ## Required Skills for Concurrency Work
  
  Load these skills before any Swift 6 work:
  
  ```bash
  skill(name="swift-concurrency-pro")
  skill(name="concurrency-patterns")
  ```
  
  Key capabilities:
  - Actor reentrancy detection
  - Sendable conformance
  - Structured concurrency patterns
  - Global actor isolation
  - @unchecked Sendable safety analysis

