id: swift-concurrency
version: "1.0.0"
description: Skills for Swift 6.2 strict concurrency compliance

skills:
  - name: swift-concurrency-pro
    load: |
      Load Swift Concurrency skill:
      ```bash
      skill(name="swift-concurrency-pro")
      ```
